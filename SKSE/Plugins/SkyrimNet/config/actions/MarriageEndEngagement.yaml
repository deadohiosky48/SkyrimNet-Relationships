# 2.5, Build A: marriage. Gated by a NATIVE decorator (registered by
# SkyrimNetRelationships.dll at data load, before SkyrimNet caches
# eligibility); the Papyrus function checks again when it runs, and the player
# confirms every change of state in a message box.

customCategory: marriage
name: MarriageEndEngagement
description: |
  Your engagement to {{ player.name }} is over: you have broken it off, or they have and you accept it.

  USE ONLY for an engagement truly ended. Not for a quarrel, a doubt, or a delay - those are part of being engaged.

questEditorId: SNRom_Quest
scriptName: SNRom_Bridge
executionFunctionName: EndEngagement

parameterMapping:
  - type: speaker
    name: akActor
    description: you, the one engaged to them
  - type: dynamic
    name: asWhy
    description: "one sentence, in your own voice, of why it is over"
    optional: true
    default: ""

eligibilityRules:
  - conditions:
      - decoratorName: "marriage_engaged"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: true
    logicalOperator: "AND"
    required: true

eventString: "{{ actor.name }} and {{ player.name }} are no longer engaged."
isShortLived: false

enabled: true
defaultPriority: 1
