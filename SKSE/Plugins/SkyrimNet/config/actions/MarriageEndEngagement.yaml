# 2.5, Build A: marriage. ELIGIBILITY HERE IS ONLY A COARSE FILTER, built from
# SkyrimNet's own faction checks: our bond faction's rank, or vanilla's priest
# and jarl factions by hex FormID. The real rules are the native ones
# (SkyrimNetRelationships.dll, Decorators.cpp), which the Papyrus function asks
# when the action runs, and the player confirms every change of state.
#
# NOT OUR OWN DECORATORS. marriage_can_accept and the rest answered correctly
# through the template preview (Hroki, 2026-10-17: accept=true), yet SkyrimNet's
# eligibility check held every action that used them ineligible: compared with
# true, with "true", and after a reload of actions with them registered. A
# built-in check it evaluates itself is the one it can be trusted to evaluate.

customCategory: marriage
name: MarriageEndEngagement
description: |
  Your engagement to {{ player.name }} is over: you have broken it off, or they have and you accept it.

  USE ONLY for an engagement truly ended. Not for a quarrel, a doubt, or a delay - those are part of being engaged.

questEditorId: SNRom_Quest
scriptName: SNRom_Bridge
executionFunctionName: EndEngagement

parameterMapping:
  - type: speaker
    name: akActor
    description: you, the one engaged to them
  - type: dynamic
    name: asWhy
    description: "one sentence, in your own voice, of why it is over"
    optional: true
    default: ""

eligibilityRules:
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SNRom_Bond"]
        comparisonOperator: ">="
        expectedValue: 0
    logicalOperator: "AND"
    required: true

eventString: "{{ actor.name }} and {{ player.name }} are no longer engaged."
isShortLived: false

enabled: true
defaultPriority: 1
