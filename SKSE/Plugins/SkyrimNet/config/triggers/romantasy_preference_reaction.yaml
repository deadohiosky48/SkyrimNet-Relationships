# Romantasy — a follower reacts to something the player did that they have an
# opinion about.
#
# Fires on Romantasy_OnPreference:
#   str_arg = the activity label (e.g. "Necks Bitten", "Locks Picked")
#   num_arg = the point change; positive = approval, negative = the opposite
#
# ── Throttled hard, on purpose ───────────────────────────────────────────────
# Romantasy awards on vanilla statistic increments, so a follower with an
# opinion about ROM_LocksPicked fires this on *every single lockpick*. At
# probability 1.0 they would comment on the player's entire thieving career.
#
# 0.15 / 300s means they speak up roughly once per few minutes of relevant
# activity — often enough to feel like someone is paying attention, rarely
# enough that it stays worth hearing. Both values are tunable from the plugin
# manifest's barks.preferenceChance if this reads wrong in play.
#
# Romantasy fires either this or OnLevelChanged for a given action, never both,
# so a tier crossing will not also produce a preference bark.
#
# ── No gender assumed ────────────────────────────────────────────────────────
# Romantasy's own documentation refers to followers as "she" throughout, but
# nothing in the system requires it: the factions apply to any actor, and this
# integration supports any player/follower gender combination. Prompt text must
# never assume - the sender_name field plus the NPC's own bio carry that, and
# baking "she" into the instruction would override the character.

# ── CONTENT IS PROSE, NOT INSTRUCTIONS. THIS IS NOT A STYLE PREFERENCE ───────
# direct_narration stores `content` VERBATIM as a persistent event, and every NPC
# in scene reads it back for the rest of the save. Written as stage directions -
# "Give her reaction in one short beat", "Do not name a tier" - those directions
# become the stored event, and the model later reproduces them as narration.
# Observed 2026-08-21: a paragraph of our own instructions turned up in a
# conversation with an unrelated NPC, attributed to an actor nobody could find,
# because it was replayed out of event history rather than generated.
#
# So: state what happened, in as few words as carry it. Where a constraint
# matters, encode it as a FACT rather than an order - "and is waiting for his
# answer" does the work "do not resolve it" used to do, and survives being
# stored. Short also matters on its own: this text is read by every NPC in scene,
# forever.
#
# ── num_arg WAS READ BARE, WHICH IS THE TRAP THIS FILE ALREADY WARNS ABOUT ───
# The approve/disapprove branch tested `{% if num_arg > 0 %}` with no event_json
# prefix. Per-event fields do not resolve bare, so that condition could never see
# a positive value and every reaction rendered as disapproval. Now
# event_json.num_arg, like every other per-event field here.

name: "romantasy_preference_reaction"
description: "A follower notices the player doing something they have strong feelings about, one way or the other."

eventCriteria:
  eventType: "mod_event"
  schemaConditions:
    - fieldPath: "event_name"
      operator: "equals"
      value: "Romantasy_OnPreference"
      caseSensitive: true

response:
  type: "direct_narration"
  content: |
    {% if event_json.num_arg > 0 %}
    {{ player_name }} has been busy with {{ event_json.str_arg }}, and it sits well with
    {{ event_json.sender_name }} - more than they would say out loud.
    {% else %}
    {{ player_name }} has been busy with {{ event_json.str_arg }}, and it sits badly with
    {{ event_json.sender_name }}.
    {% endif %}

audience: "nearby_npcs"
enabled: true
probability: 0.15
cooldownSeconds: 300
priority: 3
