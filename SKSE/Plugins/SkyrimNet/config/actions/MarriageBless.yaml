# 2.5, Build A: marriage. ELIGIBILITY HERE IS ONLY A COARSE FILTER, built from
# SkyrimNet's own faction checks: our bond faction's rank, or vanilla's priest
# and jarl factions by hex FormID. The real rules are the native ones
# (SkyrimNetRelationships.dll, Decorators.cpp), which the Papyrus function asks
# when the action runs, and the player confirms every change of state.
#
# NOT OUR OWN DECORATORS. marriage_can_accept and the rest answered correctly
# through the template preview (Hroki, 2026-10-17: accept=true), yet SkyrimNet's
# eligibility check held every action that used them ineligible: compared with
# true, with "true", and after a reload of actions with them registered. A
# built-in check it evaluates itself is the one it can be trusted to evaluate.

customCategory: marriage
name: MarriageBless
description: |
  As a priest, priestess or jarl, you marry {{ player.name }} to the one they are engaged to, here and now: they have come to you to elope.

  USE ONLY when both of them are here, both have asked you to, and you are willing. You may refuse, as yourself, for your own reasons. If you do not know them, or the match troubles you, say so.

questEditorId: SNRom_Quest
scriptName: SNRom_Bridge
executionFunctionName: BlessUnion

parameterMapping:
  - type: speaker
    name: akOfficiant
    description: you, the one marrying them
  - type: dynamic
    name: asBetrothed
    description: "the name of the one {{ player.name }} is marrying"
    optional: true
    default: ""

eligibilityRules:
  - conditions:
      # JobPriestFaction and JobJarlFaction (Skyrim.esm), by hex FormID: the
      # form that needs no editor-ID lookup.
      - decoratorName: "is_in_faction"
        arguments:
          - currentActor
          - "0x0005159A"
        comparisonOperator: "=="
        expectedValue: true
      - decoratorName: "is_in_faction"
        arguments:
          - currentActor
          - "0x00050920"
        comparisonOperator: "=="
        expectedValue: true
    logicalOperator: "OR"
    required: true

eventString: "{{ actor.name }} agreed to marry {{ player.name }} to their betrothed."
isShortLived: false

enabled: true
defaultPriority: 1
