# ELIGIBILITY USES ONLY NATIVE DECORATORS - DELIBERATELY.
# SkyrimNet evaluates and CACHES action eligibility at startup, ~13 seconds
# before a quest script's OnInit can call RegisterDecorator. A mod-added
# decorator referenced here resolves to "not found", is cached false, and the
# action stays permanently ineligible with no further errors logged.
# Surveyed all 10 registered decorators across Baka, Player Needs, Playwright,
# iActions and OStimNet: every one is used in prompts, NONE in eligibility.
# The real gates (receptivity, orientation, attraction floor) live in Papyrus,
# where they cannot be cached stale - and where the model cannot route past
# them either.
# The workhorse. An authored beat: something happened between you and the
# player that moved how you feel, in either direction.
#
# When 'activity' names one of Romantasy's tracked statistics, the bridge
# routes the award through THIS NPC's own like/dislike config - so one call
# resolves three ways depending on who they are: a gain, a wound, or nothing
# at all. That is the mechanism that makes scoring personality-aware without
# per-NPC logic. When it is empty, or they have no opinion, it falls back to a
# plain point change.
#
# The bridge clamps magnitude against the stat's weight before applying it, so
# the model cannot blow past the configured ceiling by picking a heavy stat.

customCategory: romance
name: RomanceMarkMoment
description: |
  Record that something in this exchange genuinely changed how you feel about {{ player.name }} - warmer or colder.

  USE WHEN the moment had real weight: they trusted you with something, stood by you, spoke to you with unexpected kindness or unexpected contempt, kept a promise, broke one, or behaved in a way that told you something true about them.

  DO NOT USE for ordinary pleasant conversation. Most exchanges should move nothing at all, and choosing not to use this action is the normal outcome. Reserve it for moments you would still be thinking about tomorrow.

  Negative magnitudes are as available as positive ones and you should use them without hesitation when warranted. A relationship that only ever improves is not a relationship.

  'reason' appears verbatim in the player's romance journal, so write the specific moment rather than a summary - "you spoke over me again, as though my judgement were decoration" rather than "was rude".

questEditorId: SNRom_Quest
scriptName: SNRom_Bridge
executionFunctionName: MarkMoment

parameterMapping:
  - type: speaker
    name: akActor
    description: you, the one whose feelings moved
  - type: dynamic
    name: aiMagnitude
    description: "how much this moved you, signed. 5-15 for a warm or cool exchange; 20-40 for real vulnerability, a shared risk, or a genuine slight; 50-75 only for something that changed things between you. Negative for betrayal, cruelty, or a promise broken."
  - type: dynamic
    name: asReason
    description: "one specific sentence naming what actually happened, in your own voice. This is read by the player."
  # optional/default IS THE FIX, NOT THE WORD "optional" IN THE DESCRIPTION.
  # The description is advice to the model; this is the contract with the
  # dispatcher. Without these two lines a response that omits the key entirely
  # fails at SkyrimNet's missing-parameter check (ActionLibrary.cpp:851) and
  # the WHOLE action is discarded - the NPC decided a moment mattered, wrote
  # the reason, and none of it was ever recorded. Observed three times on
  # 2026-08-23/24, all from responses carrying only aiMagnitude and asReason.
  # Papyrus already treats "" as "no activity" (MarkMoment, StatWeight), so
  # the default lands on the path that was always intended.
  - type: dynamic
    name: asActivity
    description: "optional, but ALWAYS include the key - use an empty string when it does not apply. If the moment was about a tracked pursuit, name it exactly - e.g. Persuasions, Murders, Locks Picked, Dungeons Cleared, Potions Mixed - and it will be judged against your own feelings about that pursuit. Empty if the moment was purely personal."
    optional: true
    default: ""

eligibilityRules:
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "ROM_RomanceLevel"]
        comparisonOperator: ">="
        expectedValue: 0
    logicalOperator: "AND"
    required: true

eventString: "{{ actor.name }}'s feelings toward {{ player.name }} shifted: {{ asReason }}"
isShortLived: false

enabled: true
defaultPriority: 3
