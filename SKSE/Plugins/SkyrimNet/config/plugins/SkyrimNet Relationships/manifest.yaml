plugin:
  name: "SkyrimNet Relationships"
  version: "1.8.1"
  description: "Bonds that SkyrimNet characters earn with you — friendship or romance, followers enrolled on their own and anyone else by hand, LLM-authored characters, a consent gate, and bond-aware dialogue."
  icon: "🥀"

# ── LLM Variants ─────────────────────────────────────────────────────────────
# DECLARING the variant here is what registers it with SkyrimNet. Until this
# block existed, snrom_background was hand-written into the live OpenRouter.yaml
# and nothing knew about it, which caused three symptoms with one root cause:
#
#   1. It never appeared on the Models page - that page is built from plugins'
#      declared variants, not from whatever OpenRouter.yaml happens to contain.
#   2. It was in NONE of the 16 model presets, while sever_background (declared
#      by SeverActions) is in all 16 and intel_story_dm in 10 - presets carry
#      declared variants, so ours could never be picked up.
#   3. Applying or switching a preset in the UI would therefore DELETE it. Our
#      settings.yaml still names it, and an unknown variant makes SkyrimNet
#      return NO RESPONSE - silently, for every assessor and every authoring
#      call. No error, no log line; the mod simply stops thinking.
#
# An empty override falls through to the user's base OpenRouter config, so this
# changes nothing for anyone who does not touch it. Declaration shape copied
# from the two working examples: SeverActions and IntelEngine.
variants:
  - name: snrom_background
    description: "Background scoring prompts — disposition authoring, conversational scoring, and romantic spark assessment. These fire on a timer rather than in live conversation, so latency does not matter, but they must produce a strict labeled format from a long prompt. Prefer LOW temperature and a generous timeout and token budget over speed; format drift and truncation are this mod's two historical failure modes. Structured outputs must be OFF - JSON mode returns quoted keys that the parser discards as truncated."

# NOTE: SkyrimNet plugin manifests DO NOT support dotted paths. Each dotted
# path collapses to its final segment and later ones overwrite earlier ones -
# our five log.* fields all became a single "coalesceWindowSeconds". Verified
# against SeverActions (six llm.* fields -> one "timeout") and Wintersun
# (dotted ones collapsed, undotted ones all survived). Keys must be flat and
# unique.
schema:
  fields:
    # ── Point economy ────────────────────────────────────────────────────────
    # A tier is 500 points and Spouse is 2,500. These caps keep one
    # LLM-awarded emotional beat meaningful without letting it stand in for
    # the time two people actually spend together.
    - name: "Max Points Per Award"
      path: "awardMaxPoints"
      type: "int"
      description: "Hard ceiling on a single LLM-awarded bond change, in either direction. The bridge clamps to this regardless of what the model asks for. Default: 75."
      defaultValue: 75
      category: "Point Economy"

    # ── Enrollment ───────────────────────────────────────────────────────────
    - name: "Automatic Enrollment"
      path: "enrollmentOrganic"
      type: "bool"
      description: "Start tracking a bond automatically once someone has followed you for a while (see Wait Before Tracking a New Follower). This only begins observing them at Stranger with no points - it does not start a romance. Anyone else is enrolled by hand, with the Enroll Hotkey or from the dashboard. Turn off to enroll only by hand."
      defaultValue: true
      category: "Enrollment"

    - name: "Scan Nearby NPCs For Followers"
      path: "cellScanEnabled"
      type: "bool"
      description: "Periodically look around for followers this mod has not enrolled yet. This is what catches companions recruited before installing, and anyone a follower framework never announced. Turn it OFF if you crash in busy interiors - the scan is handled by PapyrusUtil, and a VR user hit a crash inside it on a heavily patched cell. With it off, people are still enrolled when a follower framework announces them; they are simply not discovered by looking. Who is near enough to be judged does not depend on this scan. Default: on."
      defaultValue: true
      category: "Enrollment"

    # ── Spark ─────────────────────────────────────────────────────────────
    - name: "Romantic Spark Detection"
      path: "sparkEnabled"
      type: "bool"
      description: "Periodically judge whether a tracked bond has crossed from friendship into romance. Turn off to leave every bond platonic - the tier still rises with shared experience, it simply never reads as love."
      defaultValue: true
      category: "Spark"

    # ── Conversation ──────────────────────────────────────────────────────
    - name: "Conversational Scoring"
      path: "talkEnabled"
      type: "bool"
      description: "Judge periodically whether recent conversation actually moved someone's feelings toward you, and award or subtract points accordingly. Anyone enrolled who is near you is judged, following you or not. This is what lets talking to someone matter. Turn off to have bonds move only through moments the characters mark themselves."
      defaultValue: true
      category: "Conversation"

    - name: "Conversation Re-check Interval (hours)"
      path: "talkCooldownHours"
      type: "float"
      description: "Game hours before the same person's conversations are judged again. Lower means more responsive, at the cost of more LLM calls. Default: 3."
      defaultValue: 3.0
      category: "Conversation"

    - name: "Daily Conversation Cap (points)"
      path: "talkDailyCap"
      type: "int"
      description: "Most points ordinary conversation can move a bond in one game day, so talking cannot be farmed. A tier is 500. Moments where two people explicitly redefine their relationship are exempt. Default: 200."
      defaultValue: 200
      category: "Conversation"

    - name: "Days Between Redefinitions"
      path: "talkLandmarkDays"
      type: "float"
      description: "Game days before a relationship can be explicitly redefined again. A second landmark inside this window is scored as an ordinary major moment instead. Default: 3."
      defaultValue: 3.0
      category: "Conversation"

    - name: "Pause Before the Question Appears (seconds)"
      path: "askVoiceSeconds"
      type: "float"
      description: "Real seconds between someone raising the question of where you stand and the choice appearing on screen. The pause is there so they ask it in their own words first and the choice is only your half of the exchange. Too short and the box talks over them; too long and it feels detached from what they just said. Set to 0 for the choice with no spoken lead-in. Default: 6."
      defaultValue: 6.0
      category: "Conversation"

    # ── Kinship (optional, SkyrimNet-Kinship) ────────────────────────────────
    - name: "Never Romance Your Own Children"
      path: "kinshipBlockRomance"
      type: "bool"
      description: "Bars anyone SkyrimNet-Kinship records as your child from the romantic and sexual ladders, whatever their disposition says. Requires SkyrimNet-Kinship to identify them; with that mod absent this setting does nothing at all, because nobody is recorded as your child in the first place. Leave on unless you have a specific reason not to."
      defaultValue: true
      category: "Kinship"
    - name: "Let Personalities Change Over Time"
      path: "driftEnabled"
      type: "bool"
      description: "Whether a character's disposition can shift as they live. Someone who swore off commitment can fall in love and stay; someone badly treated can close up. Change requires a sustained pattern, never a single night, and moves one step at a time. Turn off to freeze everyone as they were first written. Default: on."
      defaultValue: true
      category: "Change Over Time"

    - name: "Game Days Between Reviews"
      path: "driftMinDays"
      type: "float"
      description: "Game days before the same person's disposition is looked at again. Lower means personalities move faster and cost more LLM calls. Default: 7."
      defaultValue: 7.0
      category: "Change Over Time"

    - name: "Events Required Before a Review"
      path: "driftMinEvents"
      type: "int"
      description: "How much must actually have happened to someone before their disposition is reviewed at all. Counts every scoring event. This is what stops a quiet month from being read as change: someone you have not spent time with is never reviewed, however long it has been. Default: 6."
      defaultValue: 6
      category: "Change Over Time"

    - name: "Days Events Must Span Before a Review"
      path: "driftMinSpanDays"
      type: "float"
      description: "Game days that must separate the first and last thing that happened to someone before their disposition is reviewed. Exists because six things happening in one evening is still one occasion, and asking whether a pattern has formed when only a moment exists produces an invented answer rather than an honest no. Default: 1."
      defaultValue: 1.0
      category: "Change Over Time"
    - name: "Days Together Before Romance Can Begin"
      path: "sparkMinDaysEnrolled"
      type: "float"
      description: "Game days someone must have been enrolled before romance can be judged to have begun at all. Exists because the very first judgment sees their entire history at once and almost always says yes, which turns romance into something that happens on arrival rather than something that grows. Someone the game already records as your spouse or lover skips this wait. Default: 2."
      defaultValue: 2.0
      category: "Spark"

    # ── Seeding ──────────────────────────────────────────────────────────────
    # Reconstructs a bond that already exists in the save. Only ever raises a
    # follower to what their recorded history justifies - never lowers anyone,
    # and never gives points to someone who has already earned more.
    - name: "Seed Existing Relationships"
      path: "seedEnabled"
      type: "bool"
      description: "Start anyone newly enrolled whom you already have a history with partway up the ladder instead of at Stranger, based on how they actually feel about you, your relationship rank, and whether the game records you as married or engaged. Applies once per person, including everyone already enrolled when this was installed. Turn it off before loading if you would rather every bond start from nothing."
      defaultValue: true
      category: "Seeding"

    - name: "Limit Seeds by Time Known"
      path: "seedTimeLimit"
      type: "bool"
      description: "Cap someone's head start by how long you have actually known each other, read from their oldest memory. Nothing recorded between you at all: Stranger, and only part way. Met today or yesterday: Stranger at most, however much happened. Within a week: Acquaintance. Within a month: Friend. Longer, or married: no limit. Everything that happens after they are enrolled still counts at the normal pace; this only limits how much history a new acquaintance can be credited with."
      defaultValue: true
      category: "Seeding"

    # THE CROSSHAIR KEYS, all in the DLL from 2.0 (native/src/Hotkey.h, WP8).
    # SkyrimNet's hotkey widget stores a VIRTUAL key; the 1.x settings were
    # scan codes typed as numbers because Papyrus's RegisterForKey takes
    # one, and the re-read key set to End through the widget armed H. The
    # DLL converts, so these are real hotkey fields with a modifier each,
    # under new names so a 1.x scan code is never read as a virtual key.
    #
    # ALL THREE SHIP UNBOUND. The re-author key is destructive, and binding
    # it on purpose is its confirmation; the other two would each claim a
    # key on load orders where few are free.
    - name: "Re-Read Hotkey"
      path: "rereadKey"
      type: "hotkey"
      description: "Point at someone on your roster and press this to read their standing again from the record as it now stands. Use it after improving what the mod has to read - a corrected bio, a missing diary entry, a bio block. It can only raise someone to what their history supports. Unbound until you set one."
      defaultValue: 0
      category: "Hotkeys"

    - name: "Re-Read Hotkey Modifier"
      path: "rereadKeyModifier"
      type: "select"
      description: "A key to hold with it, for example Left Shift. Each side counts separately. This narrows when the key fires; it does not stop another mod that uses the same key."
      defaultValue: "None"
      options:
        - None
        - Left Shift
        - Right Shift
        - Left Ctrl
        - Right Ctrl
        - Left Alt
        - Right Alt
      category: "Hotkeys"

    - name: "Re-Author Hotkey"
      path: "reauthorKey"
      type: "hotkey"
      description: "Point at someone on your roster and press this to write their CHARACTER again from scratch - who they are drawn to, how guarded, how ardent, how willing to share you. Throws away the current one and everything that has drifted. No undo. A second press on the same person within a minute is refused. Unbound until you set one."
      defaultValue: 0
      category: "Hotkeys"

    - name: "Re-Author Hotkey Modifier"
      path: "reauthorKeyModifier"
      type: "select"
      description: "A key to hold with it, for example Left Shift. Each side counts separately. This narrows when the key fires; it does not stop another mod that uses the same key."
      defaultValue: "None"
      options:
        - None
        - Left Shift
        - Right Shift
        - Left Ctrl
        - Right Ctrl
        - Left Alt
        - Right Alt
      category: "Hotkeys"

    - name: "Enroll Hotkey"
      path: "enrollKey"
      type: "hotkey"
      description: "Point at anyone and press this to start a bond with them, following you or not. Their character is written and their history read over the next few minutes. Followers are enrolled on their own once they have stayed with you a while; this is how everyone else joins. Unbound until you set one."
      defaultValue: 0
      category: "Hotkeys"

    - name: "Enroll Hotkey Modifier"
      path: "enrollKeyModifier"
      type: "select"
      description: "A key to hold with it, for example Left Shift. Each side counts separately. This narrows when the key fires; it does not stop another mod that uses the same key."
      defaultValue: "None"
      options:
        - None
        - Left Shift
        - Right Shift
        - Left Ctrl
        - Right Ctrl
        - Left Alt
        - Right Alt
      category: "Hotkeys"



    - name: "Most Points a Seed Can Grant"
      path: "seedMaxPoints"
      type: "int"
      description: "Ceiling on the head start any one person can be given, so no accumulated history can hand out the top of the ladder. Tiers are 500 apart and Spouse is 2500, so the default stops one full tier short. Someone the game records as your actual spouse is exempt and seeds to Spouse regardless - a completed marriage is not history to be weighed, it is the relationship itself. Default: 2000."
      defaultValue: 2000
      category: "Seeding"

    - name: "Points Per Point of Rapport"
      path: "seedPointsPerRapport"
      type: "float"
      description: "How much someone's SeverActions rapport counts toward their head start. Rapport runs -100 to 100, so the default makes a wholly devoted companion worth about 1500 points - more than being recruited, less than the game recording you as lovers. Rapport competes with relationship rank rather than adding to it; the strongest single piece of evidence wins. This is what separates someone you have genuinely traveled with from someone you hired yesterday, so setting it much lower makes every new companion start in the same place. Set to 0 to ignore rapport entirely. Default: 15."
      defaultValue: 15.0
      category: "Seeding"

    # ── Attraction ───────────────────────────────────────────────────────────
    # Reads OStim Community Resource's own attraction calculation. Without OCR
    # installed these do nothing and physical intimacy is gated on the bond
    # tier alone, which is how this mod behaved before the feed existed.
    - name: "Use OStim Attraction"
      path: "attractionEnabled"
      type: "bool"
      description: "Let someone who is written as taking sex casually act on plain physical attraction instead of waiting for the bond to deepen. Reads OStim Community Resource's attraction score; does nothing without it. Note that taking a reading makes OCR assign that NPC a social class and a randomly-chosen taste in adventurers if they have neither - OCR does this itself the first time it looks at them, but turning this off avoids causing it early."
      defaultValue: true
      category: "Attraction"

    - name: "Attraction Needed to Skip the Bond"
      path: "attractionBypassRatio"
      type: "float"
      description: "How attractive someone must find the player before wanting them physically without the bond having deepened first. 1.0 means exactly as attractive as someone of their standing expects. Only applies to characters written as taking sex casually. Early characters sit near 0.7 and established ones clear 2.0, so raise this as the game goes on. Default: 1.5."
      defaultValue: 1.5
      category: "Attraction"

    - name: "Attraction Re-check Interval (hours)"
      path: "attractionRefreshHours"
      type: "float"
      description: "Game hours before someone's attraction is recalculated. One person near you is recalculated per check and the reading is expensive, so low values cost framerate for a number that moves with skills and reputation rather than with events. Default: 24."
      defaultValue: 24.0
      category: "Attraction"

    - name: "Spark Re-check Interval (hours)"
      path: "sparkCooldownHours"
      type: "float"
      description: "Game hours before the same person is judged again. One person is judged at a time, and only while they are near you, so this mostly controls how much has to happen between chances. Default: 6."
      defaultValue: 6.0
      category: "Spark"

    - name: "Wait Before Tracking a New Follower (hours)"
      path: "enrollmentDelayHours"
      type: "float"
      description: "Game hours someone must keep traveling with you before the mod starts tracking them at all. Exists because SkyrimNet conversations can make almost anyone a follower by accident, and tracking cannot be undone once it begins. A deliberate companion clears this without noticing, even while waiting for you somewhere else; a mistake is usually gone long before it elapses. Anyone you enroll by hand skips this wait. Default: 2."
      defaultValue: 2.0
      category: "Enrollment"

    - name: "LLM-Authored Characters"
      path: "enrollmentLlmPreferences"
      type: "bool"
      description: "On enrollment, ask the LLM to write the character from their actual personality: orientation, intimacy, ardor, exclusivity and what draws them to you. Turn off to leave them at neutral defaults."
      defaultValue: true
      category: "Enrollment"

    # ── Pacing ───────────────────────────────────────────────────────────────
    # ONE LEVER ABOVE FOURTEEN KNOBS. awardMaxPoints, talkCooldownHours,
    # talkDailyCap, sparkCooldownHours, driftMinDays and nine more are all pacing
    # knobs, and nobody is going to tune fourteen numbers coherently. They stay
    # for people who want them; this moves the whole thing at once.
    #
    # It multiplies what is EARNED. It cannot move the finish line - a tier is
    # exactly 500, whatever the pace.
    - name: "Bond Pace"
      path: "bondPace"
      type: "select"
      description: "How quickly bonds move. Slow takes about twice as long, Fast about half. This multiplies points EARNED - conversation, authored moments, the spark beat and setbacks - in both directions, so Slow also makes mistakes cost less. It does NOT change the distance: a tier is always 500 points, so this changes how long the same journey takes, never where it ends. Two things are deliberately never scaled: points held back at Lover and handed back when the question is answered (scaling one side of that round trip would destroy points you watched accrue), and the seed for a relationship that already existed before this mod was installed. On Slow, any award that would round away to nothing is kept at a single point instead - seeing the needle move a little is the point of it. Default: Normal."
      defaultValue: "Normal"
      options:
        - Slow
        - Normal
        - Fast
      category: "Pacing"
    - name: "LLM Variant"
      path: "llmVariant"
      type: "select"
      description: "Which OpenRouter.yaml variant serves ALL of this mod's background LLM work - disposition authoring, conversation scoring, the romance assessment and drift reviews. MUST name a variant that exists in your config: an empty or unknown value silently returns no response. Prefer a LOW-TEMPERATURE variant. These prompts emit labeled lines that get parsed, not prose, and creative sampling is how they come back malformed - a variant tuned for diary or dialogue writing is the wrong shape even on a large model. Also wants generous max_tokens, structured output OFF and reasoning OFF. Avoid naming a variant another subsystem owns, such as DiaryGeneration or memory: retuning it for that subsystem silently retunes this one. Whichever you name may route to a paid provider depending on your OpenRouter.yaml, so if you run local models for background work, point this at one of them. Default: snrom_background, the variant this mod declares and the one shown on the Models page."
      defaultValue: "snrom_background"
      options:
        - snrom_background
        - CharacterProfileGeneration
        - AgentDefault
        - DiaryGeneration
      category: "Enrollment"

    # ── Dashboard (optional: SkyrimNetRelationships.dll and Meridian UI) ─────
    # All three are handed to the DLL by SNRom_Bridge.ArmDashboard once per
    # bootstrap, and read by the DLL itself from settings.yaml whenever SkyrimNet
    # saves it (native/src/Settings.cpp), so a change applies in seconds with no
    # Papyrus polling. Without the DLL, or without Meridian UI, none of them does
    # anything and nothing else cares.
    #
    # type: "hotkey" HERE, where the re-read and re-author keys are plain ints,
    # and that is the design working rather than a contradiction. The widget
    # stores a VIRTUAL KEY code; those two keys are registered by Papyrus, which
    # takes scan codes, while this one is handled by the DLL, which converts VK
    # natively and refuses a key it cannot map instead of binding a wrong one.
    #
    # SHIPS UNBOUND - the author's decision. The keys vanilla leaves free are
    # exactly the ones other mods reach for (see the audit on HotkeyCode), so the
    # player picks one that is free on their own load order.
    - name: "Dashboard Hotkey"
      path: "dashboardHotkey"
      type: "hotkey"
      description: "Opens the Relationships dashboard: everyone you have a bond with, how deep it runs, and who they are. UNBOUND UNTIL YOU SET ONE. Pick a key nothing else in your load order uses. Press Escape in the dashboard to close it. Needs Meridian UI; without it this does nothing and the rest of the mod works as before. Changing it takes effect a couple of seconds after the settings are saved - no reload needed."
      defaultValue: 0
      category: "Dashboard"

    # A select, so it reaches Papyrus as the option's name. The DLL and
    # SNRom_Bridge.DashboardModifierVK both map these names to the virtual key of
    # that side of the keyboard; change an option here and both must follow.
    - name: "Dashboard Hotkey Modifier"
      path: "dashboardHotkeyModifier"
      type: "select"
      description: "A key to hold with the Dashboard Hotkey, for example Left Shift so that only Left Shift + your key opens the dashboard. Each side counts separately: Left Ctrl does not accept Right Ctrl. This narrows when the dashboard opens; it does NOT stop another mod that uses the same key from reacting to it, with or without the modifier, so a key nothing else uses is still the best choice. A change applies the next time you open the dashboard, no reload needed. Default: None."
      defaultValue: "None"
      options:
        - None
        - Left Shift
        - Right Shift
        - Left Ctrl
        - Right Ctrl
        - Left Alt
        - Right Alt
      category: "Dashboard"

    - name: "Dashboard Developer View"
      path: "dashboardDeveloperView"
      type: "bool"
      description: "Shows what characters have not said: feelings they have not spoken, a question they are waiting to ask you, points held back until you answer, and the assessor's private verdicts - plus developer tools. The dashboard is written to be played without it; turn it on to look under the hood or to troubleshoot. A change applies the next time you open the dashboard, no reload needed. Default: off."
      defaultValue: false
      category: "Dashboard"

    # Two selects, so they reach Papyrus and settings.yaml as the option's name.
    # The DLL reads those names with one table (Settings::ScaleFromName and
    # TextSizeFromName in native/src/Settings.cpp), for both the name Papyrus
    # hands over at bootstrap and the one its settings watcher reads; change an
    # option here and that table must follow.
    - name: "Dashboard Scale"
      path: "dashboardScale"
      type: "select"
      description: "How big the Relationships dashboard is drawn: everything in it, text and spacing alike. Auto sizes it to your screen's height, so it looks the same at 1080p, 1440p or 4K (1440p draws it at about 133%). Pick a fixed size if Auto is too small or too large for you. A change applies the next time you open the dashboard, no reload needed. Default: Auto."
      defaultValue: "Auto"
      options:
        - Auto
        - 75%
        - 90%
        - 100%
        - 110%
        - 125%
        - 150%
        - 175%
        - 200%
      category: "Dashboard"

    - name: "Dashboard Text Size"
      path: "dashboardTextSize"
      type: "select"
      description: "Makes the dashboard's text larger without making its spacing larger, on top of Dashboard Scale. A change applies the next time you open the dashboard, no reload needed. Default: Normal."
      defaultValue: "Normal"
      options:
        - Normal
        - Large
        - Larger
      category: "Dashboard"

    # ── Logging ──────────────────────────────────────────────────────────────
    # The ledger is deliberately NOT governed by log level. Balance analysis
    # needs a complete record from the first save; discovering you needed
    # DEBUG on only after the playthrough that would have answered the
    # question is the failure mode this separation exists to prevent.
    - name: "Log Level"
      path: "logLevel"
      type: "int"
      description: "Diagnostic verbosity in snrom.log. 0 off, 1 error, 2 warn, 3 info, 4 debug (every point delta), 5 trace (full LLM payloads). Default: 3."
      defaultValue: 3
      category: "Logging"

    - name: "Write Bond Ledger"
      path: "logLedgerEnabled"
      type: "bool"
      description: "Record every point change to logs/ledger.jsonl for balance analysis with tools/analyze_romance.py. Independent of log level. Leave on unless you are certain you will never want to tune pacing."
      defaultValue: true
      category: "Logging"

    - name: "In-Game Notifications"
      path: "logNotifications"
      type: "bool"
      description: "Show corner notifications for enrollment, point awards, and clamping. Independent of log level. For troubleshooting only."
      defaultValue: false
      category: "Logging"

    - name: "Ledger Flush Interval"
      path: "logFlushEvery"
      type: "int"
      description: "Buffer this many ledger entries before writing to disk. Lower is safer against a crash losing the tail; higher is kinder to framerate. Also flushes on tier change, cell change, and save. Default: 25."
      defaultValue: 25
      category: "Logging"
