# 2.5, Build A: marriage. Gated by a NATIVE decorator (registered by
# SkyrimNetRelationships.dll at data load, before SkyrimNet caches
# eligibility); the Papyrus function checks again when it runs, and the player
# confirms every change of state in a message box.

customCategory: marriage
name: MarriageGiveRing
description: |
  You give {{ player.name }}, your betrothed, an engagement ring, now, in this moment.

  USE when you are actually handing it over. Once only: an engagement has one ring from you.

questEditorId: SNRom_Quest
scriptName: SNRom_Bridge
executionFunctionName: GiveEngagementRing

parameterMapping:
  - type: speaker
    name: akActor
    description: you, the one giving the ring

eligibilityRules:
  - conditions:
      - decoratorName: "marriage_engaged"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: true
    logicalOperator: "AND"
    required: true

eventString: "{{ actor.name }} gave {{ player.name }} an engagement ring."
isShortLived: false

enabled: true
defaultPriority: 1
