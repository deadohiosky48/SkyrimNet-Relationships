# 2.5, Build A: marriage. ELIGIBILITY IS BUILT FROM SKYRIMNET'S OWN
# get_faction_rank, on factions the DLL keeps: SNRom_Bond (the tier),
# SNRom_Marriage (the marriage state's number: 1 engaged, 2 married,
# 6 separated; Marriage.h), SNRom_Officiant (every priest, priestess and jarl;
# Officiant.h) and SNRom_Ceremony (the step of the wedding under way, on the
# officiant and the betrothed; Ceremony.h). The full rules are the native ones,
# which the Papyrus function asks when the action runs.
#
# THE WEDDING IS SPOKEN AND DIRECTED (the author, 2026-10-20). The DLL runs
# the ceremony as a fixed script (native/src/Ceremony.h) that moves on when it
# hears the right person speak: vows, then each "do you take...", then the
# pronouncement. In wpm17 each step was an action the model had to pick at
# the right moment, and the betrothed's never was. Two actions remain:
# beginning (the officiant agrees to marry them) and stopping (cold feet).
#
# NOT is_in_faction ON VANILLA'S JOB FACTIONS (rank -1 reads as not a member),
# and NOT OUR OWN DECORATORS, which SkyrimNet's eligibility check held false.

customCategory: marriage
name: MarriageColdFeet
description: |
  You are being married to {{ player.name }}, now, and you cannot go through with it - not today, perhaps not at all.

  USE only when you stop the wedding yourself: you say you cannot, or you walk away from it. Not for nerves you push through, and not for a yes. You stay engaged unless you also end the engagement.

questEditorId: SNRom_Quest
scriptName: SNRom_Bridge
executionFunctionName: CeremonyColdFeet

parameterMapping:
  - type: speaker
    name: akActor
    description: you, the one being married
  - type: dynamic
    name: asWhy
    description: "one sentence, in your own voice, of why you cannot"
    optional: true
    default: ""

eligibilityRules:
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SNRom_Ceremony"]
        comparisonOperator: ">="
        expectedValue: 1
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SNRom_Marriage"]
        comparisonOperator: "=="
        expectedValue: 1
    logicalOperator: "AND"
    required: true

eventString: "{{ actor.name }} could not say yes to {{ player.name }}."
isShortLived: false

enabled: true
defaultPriority: 1
