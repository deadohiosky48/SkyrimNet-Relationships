# 2.5, Build B (M4p): PLANNING THE WEDDING, in conversation (spec 5.3a). Each
# part of the plan is an action taken when it is agreed, over as many
# conversations as it takes; the plan is kept natively (WeddingPlan.h) and
# every prompt reads it as it stands. Eligibility on factions the DLL keeps:
# SNRom_Marriage (1 engaged), SNRom_WeddingPlanner (the five planners) and
# SNRom_Officiant (every priest, priestess and jarl). Who may change what is
# checked again in Papyrus (SNRom_Bridge.MayPlan): the betrothed, the planner
# hired for it, and for the day and the place the officiant who agreed.

# WHOSE GUESTS (wpm61; the author, 2026-10-28): each guest is one partner's,
# named by that partner ("Olfina's guests"), or both's. A guest's family
# decides it without asking; for anyone else the planner asks.
customCategory: wedding
name: WeddingSides
description: |
  Whose guests those invited to the wedding are - which of the couple each one comes for - is agreed: as the one {{ player.name }} is marrying, or the planner hired for it.

  USE when it is said in this conversation whose guest someone already invited is. Name each one as they were said.

questEditorId: SNRom_Quest
scriptName: SNRom_Bridge
executionFunctionName: PlanWeddingSides

parameterMapping:
  - type: speaker
    name: akSpeaker
    description: you
  - type: dynamic
    name: asFor
    description: "the name of the one {{ player.name }} is to marry, when you are not them yourself; empty if you are"
    optional: true
    default: ""
  - type: dynamic
    name: asTheirs
    description: "the names of those who come as guests of the one {{ player.name }} is marrying, separated by commas; empty for none"
    optional: true
    default: ""
  - type: dynamic
    name: asYours
    description: "the names of those who come as {{ player.name }}'s guests, separated by commas; empty for none"
    optional: true
    default: ""
  - type: dynamic
    name: asBoth
    description: "the names of those who come for both of them, separated by commas; empty for none"
    optional: true
    default: ""

eligibilityRules:
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SNRom_Marriage"]
        comparisonOperator: "=="
        expectedValue: 1
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SNRom_WeddingPlanner"]
        comparisonOperator: ">="
        expectedValue: 0
    logicalOperator: "OR"
    required: true
  # NOT DURING A WEDDING (wpm77): the ceremony is the script's alone, and
  # the officiant chose this category mid-ceremony in wpm76.
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SNRom_Ceremony"]
        comparisonOperator: "<"
        expectedValue: 1
    logicalOperator: "AND"
    required: true

eventString: "{{ actor.name }} and {{ player.name }} settled whose guests are whose."
isShortLived: true

enabled: true
defaultPriority: 1
