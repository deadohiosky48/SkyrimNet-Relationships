# 2.5, Build B (M4p): PLANNING THE WEDDING, in conversation (spec 5.3a). Each
# part of the plan is an action taken when it is agreed, over as many
# conversations as it takes; the plan is kept natively (WeddingPlan.h) and
# every prompt reads it as it stands. Eligibility on factions the DLL keeps:
# SNRom_Marriage (1 engaged), SNRom_WeddingPlanner (the five planners) and
# SNRom_Officiant (every priest, priestess and jarl). Who may change what is
# checked again in Papyrus (SNRom_Bridge.MayPlan): the betrothed, the planner
# hired for it, and for the day and the place the officiant who agreed.

customCategory: wedding
name: WeddingCeremony
description: |
  As the wedding planner, you settle with {{ player.name }} what the ceremony will have beyond its heart (the vows, always the couple's own words, and each "do you take"): the officiant's address to everyone gathered, a reading or blessing, the rings exchanged, the kiss.

  USE when they have chosen, in this conversation - including "all of it", "the usual" or "whatever you think best" (all yes), or leaving out only one or two (the rest yes).

questEditorId: SNRom_Quest
scriptName: SNRom_Bridge
executionFunctionName: PlanWeddingCeremony

parameterMapping:
  - type: speaker
    name: akPlanner
    description: you, the planner
  - type: dynamic
    name: asFor
    description: "the name of the one {{ player.name }} is to marry, when you are not them yourself; empty if you are"
    optional: true
    default: ""
  - type: dynamic
    name: asAddress
    description: "yes or no: the officiant addresses everyone gathered"
  - type: dynamic
    name: asReading
    description: "yes or no: a reading or a blessing"
  - type: dynamic
    name: asRings
    description: "yes or no: the rings exchanged before they are pronounced married"
  - type: dynamic
    name: asKiss
    description: "yes or no: the kiss"

eligibilityRules:
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SNRom_WeddingPlanner"]
        comparisonOperator: ">="
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  # NOT DURING A WEDDING (wpm77): the ceremony is the script's alone, and
  # the officiant chose this category mid-ceremony in wpm76.
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SNRom_Ceremony"]
        comparisonOperator: "<"
        expectedValue: 1
    logicalOperator: "AND"
    required: true

eventString: "{{ actor.name }} and {{ player.name }} settled the wedding ceremony."
isShortLived: true

enabled: true
defaultPriority: 1
