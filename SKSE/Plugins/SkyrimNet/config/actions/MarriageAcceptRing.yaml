# 2.5, Build A: marriage. Gated by a NATIVE decorator (registered by
# SkyrimNetRelationships.dll at data load, before SkyrimNet caches
# eligibility); the Papyrus function checks again when it runs, and the player
# confirms every change of state in a message box.

customCategory: marriage
name: MarriageAcceptRing
description: |
  {{ player.name }}, your betrothed, is giving you an engagement ring, now, and you take it.

  USE when they are offering it to you in this moment. They choose which ring; you put it on.

questEditorId: SNRom_Quest
scriptName: SNRom_Bridge
executionFunctionName: AcceptEngagementRing

parameterMapping:
  - type: speaker
    name: akActor
    description: you, the one receiving the ring
  - type: dynamic
    name: asRing
    description: "the ring's name, if they named it; otherwise an empty string"
    optional: true
    default: ""

eligibilityRules:
  - conditions:
      - decoratorName: "marriage_engaged"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: true
    logicalOperator: "AND"
    required: true

eventString: "{{ player.name }} offered {{ actor.name }} an engagement ring."
isShortLived: false

enabled: true
defaultPriority: 1
