# 2.5, Build B (M4p): PLANNING THE WEDDING, in conversation (spec 5.3a). Each
# part of the plan is an action taken when it is agreed, over as many
# conversations as it takes; the plan is kept natively (WeddingPlan.h) and
# every prompt reads it as it stands. Eligibility on factions the DLL keeps:
# SNRom_Marriage (1 engaged), SNRom_WeddingPlanner (the five planners) and
# SNRom_Officiant (every priest, priestess and jarl). Who may change what is
# checked again in Papyrus (SNRom_Bridge.MayPlan): the betrothed, the planner
# hired for it, and for the day and the place the officiant who agreed.

customCategory: wedding
name: WeddingGuests
description: |
  Who is invited to the wedding, or no longer: as the one {{ player.name }} is marrying, or the planner hired for it.

  USE when names are agreed in this conversation. Each one invited is told, and decides as themselves whether to come.

questEditorId: SNRom_Quest
scriptName: SNRom_Bridge
executionFunctionName: PlanWeddingGuests

parameterMapping:
  - type: speaker
    name: akSpeaker
    description: you
  - type: dynamic
    name: asFor
    description: "the name of the one {{ player.name }} is to marry, when you are not them yourself; empty if you are"
    optional: true
    default: ""
  - type: dynamic
    name: asInvite
    description: "the names of those invited now, separated by commas; 'none' when they want no guests at all; empty when no one new was invited"
    optional: true
    default: ""
  - type: dynamic
    name: asUninvite
    description: "the names of those no longer invited, separated by commas; empty for none"
    optional: true
    default: ""

eligibilityRules:
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SNRom_Marriage"]
        comparisonOperator: "=="
        expectedValue: 1
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SNRom_WeddingPlanner"]
        comparisonOperator: ">="
        expectedValue: 0
    logicalOperator: "OR"
    required: true

eventString: "{{ actor.name }} and {{ player.name }} settled who is coming to the wedding."
isShortLived: true

enabled: true
defaultPriority: 1
