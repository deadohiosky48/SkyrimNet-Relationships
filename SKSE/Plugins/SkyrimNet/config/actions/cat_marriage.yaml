# Marriage category (2.5, Build A). A ROUTER, NOT A GATE: see cat_romance.yaml.
# It names the situations concretely; the gates are the actions' native
# decorators and the Papyrus checks behind them.
#
# BOTH WAYS A YES COMES (wpm83): "answering a proposal" read as the speaker's
# own answer. Daighre had asked; the player's yes was not an answer of hers,
# so her reply passed the category by and the engagement went unrecorded.

customCategory: marriage
actionType: category
name: Marriage
description: "Marriage with the player: agreeing to marry - your yes to their proposal, or their yes to yours - or turning a proposal down, breaking off an engagement, giving or accepting an engagement ring, or - for a priest, priestess or jarl - marrying the player to the one they are engaged to, or, for the one being married, stopping a wedding under way. SELECT THIS whenever marrying, being engaged, a ring or a wedding is what is being talked about. Choosing this commits you to nothing: you will see the options and may decline."
enabled: true
