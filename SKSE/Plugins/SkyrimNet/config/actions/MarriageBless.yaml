# 2.5, Build A: marriage. ELIGIBILITY IS BUILT FROM SKYRIMNET'S OWN
# get_faction_rank, on factions the DLL keeps: SNRom_Bond (the tier),
# SNRom_Marriage (the marriage state's number: 1 engaged, 2 married,
# 6 separated; Marriage.h), SNRom_Officiant (every priest, priestess and jarl;
# Officiant.h) and SNRom_Ceremony (the step of the wedding under way, on the
# officiant and the betrothed; Ceremony.h). The full rules are the native ones,
# which the Papyrus function asks when the action runs.
#
# THE WEDDING IS SPOKEN (the author, 2026-10-20): the officiant opens and asks
# the player, then the betrothed, whether each takes the other, and
# pronounces them married once both have said yes. One action per step,
# offered only at its step; only the pronouncement records the marriage, and
# no message box asks anything.
#
# NOT is_in_faction ON VANILLA'S JOB FACTIONS (rank -1 reads as not a member),
# and NOT OUR OWN DECORATORS, which SkyrimNet's eligibility check held false.

customCategory: marriage
name: MarriageBless
description: |
  As a priest, priestess or jarl, you begin to marry {{ player.name }} to the one they are engaged to, here and now.

  USE when they have asked you to marry them and you are willing to do it now, quietly or before whoever is here. This only begins it: you will say a few words fitting the moment and ask each of them in turn whether they take the other; nobody is married until both have said yes and you pronounce it. You may refuse, as yourself, for your own reasons; then do not use this, and say so.

questEditorId: SNRom_Quest
scriptName: SNRom_Bridge
executionFunctionName: BlessUnion

parameterMapping:
  - type: speaker
    name: akOfficiant
    description: you, the one marrying them
  - type: dynamic
    name: asBetrothed
    description: "the name of the one {{ player.name }} is marrying"
    optional: true
    default: ""

eligibilityRules:
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SNRom_Officiant"]
        comparisonOperator: ">="
        expectedValue: 0
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SNRom_Marriage"]
        comparisonOperator: "!="
        expectedValue: 1
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SNRom_Ceremony"]
        comparisonOperator: "<"
        expectedValue: 1
    logicalOperator: "AND"
    required: true

eventString: "{{ actor.name }} began to marry {{ player.name }} to their betrothed."
isShortLived: false

enabled: true
defaultPriority: 1
