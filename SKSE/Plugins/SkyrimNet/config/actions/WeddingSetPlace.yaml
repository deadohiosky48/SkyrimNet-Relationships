# 2.5, Build B (M4p): PLANNING THE WEDDING, in conversation (spec 5.3a). Each
# part of the plan is an action taken when it is agreed, over as many
# conversations as it takes; the plan is kept natively (WeddingPlan.h) and
# every prompt reads it as it stands. Eligibility on factions the DLL keeps:
# SNRom_Marriage (1 engaged), SNRom_WeddingPlanner (the five planners) and
# SNRom_Officiant (every priest, priestess and jarl). Who may change what is
# checked again in Papyrus (SNRom_Bridge.MayPlan): the betrothed, the planner
# hired for it, and for the day and the place the officiant who agreed.

customCategory: wedding
name: WeddingSetPlace
description: |
  Where the wedding will be is agreed, or changed: as the one {{ player.name }} is marrying, as the planner hired for it, or as the one who will marry them.

  USE when a place is settled in this conversation, or what it is by is said. Name it as a real place one could walk to: a temple, a hall, an inn, a spot that means something to them. A spot that is not a building or a town (beneath an old tree, a lakeshore, a hilltop) needs what it is by, so the guests can find it. When it is right where {{ player.name }} is standing as they say so ("this is the place", "right here", "this spot"), the place is here: it is marked where they stand, and needs nothing else.

questEditorId: SNRom_Quest
scriptName: SNRom_Bridge
executionFunctionName: PlanWeddingPlace

parameterMapping:
  - type: speaker
    name: akSpeaker
    description: you
  - type: dynamic
    name: asFor
    description: "the name of the one {{ player.name }} is to marry, when you are not them yourself; empty if you are"
    optional: true
    default: ""
  - type: dynamic
    name: asPlace
    description: "the place's proper name, e.g. 'Temple of Mara, Riften' or 'Dragonsreach'; add the town when names repeat; 'here' when it is right where {{ player.name }} stands, or 'here: ' and a few words for it ('here: the crag above the valley'); empty when only what it is by was said"
    optional: true
    default: ""
  # A PLACE PEOPLE CAN FIND (seen in play, wpm59): "Under the Gildergreen"
  # was no place SeverActions knew, and everyone sent to it went nowhere.
  # RIGHT HERE (wpm86): a crag near nothing had no name to give, and the
  # place was left empty, "by The Reach". 'here' is the spot itself.
  - type: dynamic
    name: asNear
    description: "for a spot that is not a building or a town, the temple, hall, inn or town it is by, e.g. 'Riverwood' or 'Temple of Kynareth'; empty otherwise"
    optional: true
    default: ""

eligibilityRules:
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SNRom_Marriage"]
        comparisonOperator: "=="
        expectedValue: 1
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SNRom_WeddingPlanner"]
        comparisonOperator: ">="
        expectedValue: 0
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SNRom_Officiant"]
        comparisonOperator: ">="
        expectedValue: 0
    logicalOperator: "OR"
    required: true
  # NOT DURING A WEDDING (wpm77): the ceremony is the script's alone, and
  # the officiant chose this category mid-ceremony in wpm76.
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SNRom_Ceremony"]
        comparisonOperator: "<"
        expectedValue: 1
    logicalOperator: "AND"
    required: true

eventString: "{{ actor.name }} and {{ player.name }} settled where the wedding will be."
isShortLived: true

enabled: true
defaultPriority: 1
