# 2.5, Build B (M4p): PLANNING THE WEDDING, in conversation (spec 5.3a). Each
# part of the plan is an action taken when it is agreed, over as many
# conversations as it takes; the plan is kept natively (WeddingPlan.h) and
# every prompt reads it as it stands. Eligibility on factions the DLL keeps:
# SNRom_Marriage (1 engaged), SNRom_WeddingPlanner (the five planners) and
# SNRom_Officiant (every priest, priestess and jarl). Who may change what is
# checked again in Papyrus (SNRom_Bridge.MayPlan): the betrothed, the planner
# hired for it, and for the day and the place the officiant who agreed.

# WHERE EVERYONE STANDS (wpm61; the author, 2026-10-28): marks set by
# conversation, at the place itself. A mark is always where the player
# stands as they say it (only the player marks); the officiant and the betrothed
# hold at theirs, each one's guests gather around their own. Kept with the
# place, so the same place named for another wedding brings its marks.
customCategory: wedding
name: WeddingMark
description: |
  Where someone stands at the wedding is marked, right where {{ player.name }} is standing now: as the one {{ player.name }} is marrying, or the planner hired for it.

  USE whenever {{ player.name }}, at the place, says someone will stand or gather here: "I want you to stand here" (to the one who will marry them - you, if that is you), "I will stand here", "<the one they marry> will stand here", "<either one>'s guests can gather here", "my guests here". One mark each time it is said. Only where {{ player.name }} stands can be marked: for 'over there', ask them to go and stand on it. Also USE when they would rather not mark anything and leave it to the planner.

questEditorId: SNRom_Quest
scriptName: SNRom_Bridge
executionFunctionName: PlanWeddingMark

parameterMapping:
  - type: speaker
    name: akSpeaker
    description: you
  - type: dynamic
    name: asFor
    description: "the name of the one {{ player.name }} is to marry, when you are not them yourself; empty if you are"
    optional: true
    default: ""
  - type: dynamic
    name: asWhat
    description: "who stands here: 'officiant' (the one who marries them; you, if you are marrying them), 'player' ({{ player.name }} themselves: 'I will stand here'), 'betrothed' (the one {{ player.name }} is marrying, by name: '<name> will stand here'), 'guests' (one side's guests: '<name>'s guests gather here'), or 'none' when they leave it to the planner"
  - type: dynamic
    name: asWhose
    description: "for 'guests', the name of whichever of the couple these guests come for; empty otherwise"
    optional: true
    default: ""

eligibilityRules:
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SNRom_Marriage"]
        comparisonOperator: "=="
        expectedValue: 1
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SNRom_WeddingPlanner"]
        comparisonOperator: ">="
        expectedValue: 0
    logicalOperator: "OR"
    required: true

eventString: "{{ actor.name }} and {{ player.name }} settled where everyone will stand at the wedding."
isShortLived: true

enabled: true
defaultPriority: 1
