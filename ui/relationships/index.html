<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relationships</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Everything here is local: the page is served from mod:// in game, with no
     network. No CDN, no web font, no remote image. -->
<div class="panel" id="panel">
  <header class="head">
    <div class="head-title">
      <h1>Relationships</h1>
      <p class="head-sub" id="summary" aria-live="polite" data-t="app.waiting">Waiting for the game&hellip;</p>
    </div>
    <button type="button" class="icon-btn" id="close-btn" title="Close (Esc)" data-t-title="app.close.title" aria-label="Close the dashboard" data-t-aria-label="app.close.aria">&times;</button>
  </header>

  <!-- How current the roster is (snapshot.roster, WP2). Hidden when it is. -->
  <p class="roster-status" id="roster-status" role="status" hidden></p>

  <div class="crosshair" id="crosshair" hidden>
    <p class="crosshair-text" id="crosshair-text"></p>
    <button type="button" class="btn btn-accent" id="crosshair-btn"></button>
  </div>

  <div class="toolbar" role="search">
    <label class="field field-grow">
      <span class="field-label" data-t="filter.find">Find</span>
      <input type="text" id="f-text" placeholder="Name" data-t-placeholder="filter.find.placeholder" autocomplete="off" spellcheck="false">
    </label>
    <label class="field">
      <span class="field-label" data-t="filter.following">Following</span>
      <select id="f-following">
        <option value="all" data-t="filter.anyone">Anyone</option>
        <option value="yes" data-t="roster.following">Following</option>
        <option value="no" data-t="filter.notFollowing">Not following</option>
      </select>
    </label>
    <label class="field">
      <span class="field-label" data-t="col.track">Track</span>
      <select id="f-track">
        <option value="all" data-t="filter.both">Both</option>
        <option value="platonic" data-t="track.platonic">Platonic</option>
        <option value="romantic" data-t="track.romantic">Romantic</option>
      </select>
    </label>
    <label class="field">
      <span class="field-label" data-t="col.state">State</span>
      <select id="f-state"><option value="all" data-t="filter.any">Any</option></select>
    </label>
    <label class="field">
      <span class="field-label" data-t="col.commitment">Commitment</span>
      <select id="f-commitment">
        <option value="all" data-t="filter.any">Any</option>
        <option value="married" data-t="commitment.married">Married</option>
        <option value="engaged" data-t="commitment.engaged">Engaged</option>
        <option value="candidate" data-t="commitment.candidate">Marriage candidate</option>
        <option value="none" data-t="commitment.none">None recorded</option>
      </select>
    </label>
    <label class="field">
      <span class="field-label" data-t="filter.standing">Standing</span>
      <select id="f-standing">
        <option value="all" data-t="filter.any">Any</option>
        <option value="good" data-t="filter.goodWill">Good will</option>
        <option value="none" data-t="filter.neither">Neither</option>
        <option value="ill" data-t="filter.illWill">Ill will</option>
      </select>
    </label>
    <label class="field">
      <span class="field-label" data-t="filter.sort">Sort</span>
      <select id="f-sort">
        <option value="depth-desc" data-t="sort.deepest">Deepest first</option>
        <option value="depth-asc" data-t="sort.shallowest">Shallowest first</option>
        <option value="name-asc" data-t="sort.nameAsc">Name, A to Z</option>
        <option value="name-desc" data-t="sort.nameDesc">Name, Z to A</option>
      </select>
    </label>
    <p class="toolbar-count" id="count" aria-live="polite"></p>
  </div>

  <main class="body" id="body">
    <section class="roster" id="roster" aria-label="Roster" data-t-aria-label="roster.aria"></section>
    <aside class="detail" id="detail" aria-label="Details" data-t-aria-label="detail.panel.aria" hidden></aside>
  </main>

  <footer class="foot">
    <p class="foot-store" id="store"></p>
    <button type="button" class="btn btn-quiet" id="repairs-btn" data-t="app.repairs.button">Playthrough repairs&hellip;</button>
    <!-- Only in the developer view (app.js, renderBadge). -->
    <button type="button" class="btn btn-quiet btn-dev" id="devtools-btn" data-t="app.devtools.button" hidden>Developer tools&hellip;</button>
    <p class="foot-hint"><kbd>&uarr;</kbd><kbd>&darr;</kbd> <span data-t="hint.move">move</span> &middot; <kbd>Enter</kbd> <span data-t="hint.open">open</span> &middot; <kbd>Esc</kbd> <span data-t="hint.back">back or close</span></p>
  </footer>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" hidden>
  <h2 id="dialog-title"></h2>
  <div id="dialog-body"></div>
  <div class="dialog-buttons" id="dialog-buttons"></div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="bridge.js"></script>
<script src="picker.js"></script>
<script src="mode.js"></script>
<script src="display.js"></script>
<script src="labels.js"></script>
<script src="actions.js"></script>
<script src="model.js"></script>
<script src="roster.js"></script>
<script src="detail.js"></script>
<script src="app.js"></script>
</body>
</html>
